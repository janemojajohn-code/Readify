name: Build, Validate & Publish ReadFlow AI APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK & Artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Verify APK Output
        run: |
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ReadFlow-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  release-apk:
    name: Publish GitHub Tagged Release
    needs: build-android
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: ReadFlow-AI-APK
          path: release-output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-output/app-debug.apk
          body: |
            ## ReadFlow AI Mobile Release 🚀
            An intelligent study companion app for reading, listening to, and studying documents.
            
            ### Features Included:
            - **TTS Narration Reader:** Real-time word boundary highlighting & smooth scrolling
            - **Interactive Voice Picker:** Filter and preview speech voices
            - **AI Summarization & Q&A:** Smart summaries and document Q&A assistant
            - **Library & Notes:** Manage highlights, bookmarks, and sticky notes
            - **Custom Styling:** Dark Mode, typography options, and cover color banners
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
